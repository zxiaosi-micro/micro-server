Name: admin-bff-api
Host: 0.0.0.0
Port: 8889
IdentityRpc:
  Endpoints:
    - ${IDENTITY_RPC|127.0.0.1:8081}   # dev 直连；prod 换 Etcd+Target
  NonBlock: true
PartyRpc:
  Endpoints:
    - ${PARTY_RPC|127.0.0.1:8082}
  NonBlock: true
CatalogRpc:
  Endpoints:
    - ${CATALOG_RPC|127.0.0.1:8083}
  NonBlock: true
InventoryRpc:
  Endpoints:
    - ${INVENTORY_RPC|127.0.0.1:8084}
  NonBlock: true
NotificationRpc:
  Endpoints:
    - ${NOTIFICATION_RPC|127.0.0.1:8089}
  NonBlock: true
AuditRpc:
  Endpoints:
    - ${AUDIT_RPC|127.0.0.1:8087}
  NonBlock: true
Jwt:
  KeysDir: "${JWT_KEYS_DIR|}"          # 缺省回落 JWT_KEYS_DIR 环境变量
Sessionx:
  Addr: "${REDIS_HOSTS|127.0.0.1:26379}"
  Password: "${REDIS_PASS|}"
  DB: 4                                # 会话/auth_cache 只读方（identity 是唯一写入方）
Authz:
  SkipPaths:                           # 免鉴权 = 认证动作精确路径（02 §9.5 /auth/* /sso/*；
                                       # /auth/me、/auth/menus 属鉴权组，不在其列）
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/auth/step-up
    - /sso
    - /healthz
  FailClosePrefixes: []                # 预留指令/财务（S5+ 登记，Redis 故障拒绝）
  SensitivePrefixes: []                # 预留敏感路由（step-up 强制，S4+）
  AllowedClients:
    - ADMIN_WEB                        # admin-bff 仅服务管理后台端
Prometheus:
  Host: 0.0.0.0
  Port: 9118
Telemetry:
  Name: admin-bff
  Endpoint: ${OTLP_ENDPOINT|127.0.0.1:24317}
  Sampler: 1.0
  Batcher: otlpgrpc        # E18：Batcher: jaeger 已废弃，配了启动失败
