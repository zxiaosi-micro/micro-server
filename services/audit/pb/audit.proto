syntax = "proto3";

package audit;

option go_package = "./pb";

// Audit 审计服务契约（S4-04，v4/03 阶段 4）。
//
// 追加式禁改删（01 FR-SYS-001）：只有 Write/List，无 Update/Delete——
// before/after 快照、trace_id 全程可溯；cmd_audit 是控制指令独立审计流（S7 产生）。
// audit_event topic 消费（Relay 落地后）属 S5；本阶段提供 RPC 写入与查询。
service Audit {
  rpc Ping(PingReq) returns (PingResp);

  rpc WriteLog(WriteLogReq) returns (WriteLogResp);
  rpc ListLog(ListLogReq) returns (ListLogResp);
  rpc WriteCmdLog(WriteCmdLogReq) returns (WriteCmdLogResp);
  rpc ListCmdLog(ListCmdLogReq) returns (ListCmdLogResp);
}

message PingReq {}

message PingResp {
  string pong = 1;
}

message AuditLogItem {
  int64 log_id = 1;
  string trace_id = 2;
  int64 uid = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string before_json = 7;
  string after_json = 8;
  string result = 9;
  string client = 10;
  int64 on_behalf_of = 11;
  int64 created_at = 12; // UnixMilli
}

message WriteLogReq {
  int64 uid = 1;
  string action = 2;
  string target_type = 3;
  string target_id = 4;
  string before_json = 5;
  string after_json = 6;
  string result = 7;     // OK/FAIL
  string client = 8;
  int64 on_behalf_of = 9;
  string detail_json = 10;
  string trace_id = 11;
  int64 tenant_id = 12;  // BFF 已注入 ctx 时 Logic 优先 ctx（后台作业显式传）
}

message WriteLogResp {
  int64 log_id = 1;
}

message ListLogReq {
  string action = 1;   // 空 = 全部
  int64 uid = 2;       // 0 = 全部
  string target_type = 3;
  string target_id = 4;
  int64 page = 5;
  int64 size = 6;
}

message ListLogResp {
  repeated AuditLogItem list = 1;
  int64 total = 2;
}

message CmdAuditItem {
  int64 cmd_audit_id = 1;
  string cmd_id = 2;
  string sn = 3;
  int64 uid = 4;
  string action = 5;
  string payload_json = 6;
  string result = 7;
  string error = 8;
  string trace_id = 9;
  int64 created_at = 10;
}

message WriteCmdLogReq {
  string cmd_id = 1;
  string sn = 2;
  int64 uid = 3;
  string action = 4;
  string payload_json = 5;
  string result = 6;
  string error = 7;
  string trace_id = 8;
  int64 tenant_id = 9;
}

message WriteCmdLogResp {
  int64 cmd_audit_id = 1;
}

message ListCmdLogReq {
  string sn = 1;       // 空 = 全部
  string cmd_id = 2;   // 空 = 全部
  int64 page = 3;
  int64 size = 4;
}

message ListCmdLogResp {
  repeated CmdAuditItem list = 1;
  int64 total = 2;
}
