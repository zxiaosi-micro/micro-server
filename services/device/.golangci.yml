# golangci-lint v2 配置(CI 同款,make lint / S0-02)
version: "2"

linters:
  # standard = errcheck / govet / ineffassign / staticcheck / unused
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      # 服务侧"尽力而为"清理调用豁免(连接关闭等由 tools/.golangci.yml 同口径)
      exclude-functions:
        - (*github.com/redis/go-redis/v9.Client).Close
        - (io.Closer).Close
        - (*database/sql.DB).Close
    staticcheck:
      # SA5008:go-zero 配置标签(json:",optional"/options=)为框架扩展,非标准 json tag
      # QF1008:go-zero 配置结构体惯用嵌入字段显式书写,保持可读
      # ST1020/ST1003/ST1000:goctl 生成物 handler 中文注释不以函数名开头、
      # config 字段 go-zero 驼峰惯用(IdentityRpc)、服务 main 包不强制包注释——生成物禁手改(02 §3.2)
      checks: ["all", "-SA5008", "-QF1008", "-ST1020", "-ST1003", "-ST1000"]

formatters:
  enable:
    - gofmt
