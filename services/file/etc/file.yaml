Name: file.rpc
ListenOn: "0.0.0.0:${RPC_PORT|8086}"
Etcd:
  Hosts:
    - ${ETCD_HOSTS|127.0.0.1:22379}
  Key: file.rpc
Mysql:
  DataSource: "${DSN|}"
Minio:
  Endpoint: ${MINIO_ENDPOINT|127.0.0.1:29000}
  AccessKey: "${MINIO_ACCESS_KEY|}"
  SecretKey: "${MINIO_SECRET_KEY|}"
  BucketDefault: micro-file
  BucketContract: micro-contract
  UseSSL: false
Cache:
  - Host: "${REDIS_HOSTS|127.0.0.1:26379}"
    Pass: "${REDIS_PASS|}"
    Type: node
Prometheus:
  Host: 0.0.0.0
  Port: 9106
Telemetry:
  Name: file
  Endpoint: ${OTLP_ENDPOINT|127.0.0.1:24317}
  Sampler: 1.0
  Batcher: otlpgrpc        # E18：Batcher: jaeger 已废弃，配了启动失败
ConfigKey: ${CONFIG_KEY|/micro/config/file/main}   # configcenter（S4 起消费，ADR-10）
